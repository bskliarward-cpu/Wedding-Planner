<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berry & Pepsi's Wedding · Venues</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <header class="app-header">
    <a href="home.html" class="app-logo">
      <img class="monogram" src="photo.jpg" alt="Berry &amp; Pepsi">
      <h1>Berry & Pepsi's Wedding</h1>
    </a>
    <div class="header-right">
      <span class="user-email" id="user-email"></span>
      <button class="btn-signout" id="btn-signout">Sign out</button>
    </div>
  </header>

  <nav class="app-nav">
    <a href="app.html"    class="nav-link active">Venues</a>
    <a href="guests.html" class="nav-link">Guest List</a>
    <a href="budget.html" class="nav-link">Budget</a>
    <a href="tasks.html"     class="nav-link">Tasks</a>
    <a href="moodboard.html" class="nav-link">Mood Board</a>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">
        <h2>Venues</h2>
        <p>Explore and compare potential venues for the big day</p>
      </div>
      <button class="btn-accent" id="btn-add">+ Add venue</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">
        All <span class="count-badge" id="count-all">0</span>
      </button>
      <button class="filter-btn" data-filter="considering">
        Considering <span class="count-badge" id="count-considering">0</span>
      </button>
      <button class="filter-btn" data-filter="shortlisted">
        Shortlisted <span class="count-badge" id="count-shortlisted">0</span>
      </button>
      <button class="filter-btn" data-filter="rejected">
        Rejected <span class="count-badge" id="count-rejected">0</span>
      </button>
      <select class="sort-select" id="sort-select">
        <option value="created_at_desc">Newest first</option>
        <option value="name_asc">Name (A–Z)</option>
        <option value="rating_desc">Highest rated</option>
        <option value="price_asc">Price (low–high)</option>
        <option value="price_desc">Price (high–low)</option>
      </select>
    </div>

    <div class="venues-grid" id="venues-grid">
      <div class="empty-state">
        <h3>Loading...</h3>
      </div>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add Venue</h3>
        <button class="btn-close" id="btn-modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="venue-form">
        <div class="modal-body">

          <div class="fetch-bar">
            <div class="fetch-input-row">
              <input type="url" id="f-fetch-url" placeholder="Paste a venue URL to auto-fill the form…" autocomplete="off">
              <button type="button" class="btn-fetch" id="btn-fetch">Fill in</button>
            </div>
            <div id="fetch-status" class="fetch-status hidden"></div>
          </div>

          <div class="modal-divider"><span>Details</span></div>

          <div class="field">
            <label for="f-name">Venue name *</label>
            <input type="text" id="f-name" required placeholder="e.g. The Old Manor House">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-location">Location</label>
              <input type="text" id="f-location" placeholder="e.g. Bath, Somerset">
            </div>
            <div class="field">
              <label for="f-status">Status</label>
              <select id="f-status">
                <option value="considering">Considering</option>
                <option value="shortlisted">Shortlisted</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="f-website">Website</label>
            <input type="url" id="f-website" placeholder="https://www.venuename.com">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-capacity">Guest capacity</label>
              <input type="number" id="f-capacity" placeholder="e.g. 150" min="1">
            </div>
            <div class="field">
              <label>Your rating</label>
              <div class="star-input" id="star-input">
                <button type="button" class="star-btn" data-star="1">&#9733;</button>
                <button type="button" class="star-btn" data-star="2">&#9733;</button>
                <button type="button" class="star-btn" data-star="3">&#9733;</button>
                <button type="button" class="star-btn" data-star="4">&#9733;</button>
                <button type="button" class="star-btn" data-star="5">&#9733;</button>
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-price-min">Min price (£)</label>
              <input type="number" id="f-price-min" placeholder="e.g. 5000" min="0">
            </div>
            <div class="field">
              <label for="f-price-max">Max price (£)</label>
              <input type="number" id="f-price-max" placeholder="e.g. 10000" min="0">
            </div>
          </div>

          <div class="field">
            <label for="f-notes">Notes</label>
            <textarea id="f-notes" placeholder="Parking, catering, availability, vibe…"></textarea>
          </div>

          <div class="field">
            <label for="f-image-url">Photo URL <span class="label-hint">(auto-filled from fetch — paste any image URL to override)</span></label>
            <div class="image-field-row">
              <input type="url" id="f-image-url" placeholder="https://…">
              <button type="button" class="btn-clear-image" id="btn-clear-image" title="Remove photo">&#x2715;</button>
            </div>
            <div class="image-preview-wrap hidden" id="image-preview-wrap">
              <img id="image-preview" src="" alt="Preview">
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn-accent" id="btn-save">Save venue</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
